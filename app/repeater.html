<!--metadata:
{
    "title": "View Repeater | OpenRepeaterDB",
    "css": ["repeater"]
}
:endmetadata-->
{{header}}
    <main>
        <h1>{{callsign}}</h1>
        <p>{{city}}, {{region}}, {{country}}</p>
        <p><b>Downlink</b>: {{downlink}} MHz</p>
        <p><b>Uplink</b>: {{uplink}} MHz</p>
        <p><b>Offset</b>: {{offset}} MHz</p>
        <p style="display: {{uplink_tone_display}}"><b>Uplink Tone</b>: {{tone}} Hz</p>
        <p><b>Website</b>: <a href="{{website}}" target="_blank">{{website}}</a></p>
        <p><b>Location</b>: <a href="https://www.google.com/maps/search/?api=1&query={{lat}},{{lng}}" target="_blank">{{lat}}, {{lng}}</a></p>
        <p><b>Notes</b>:</p>
        <div class="notesContent">
            {{notes}}
        </div>
        <p><b>Last Updated</b>: {{last_updated}}</p>
        <p><a href="/edit/{{id}}">Edit this repeater</a></p>
    </main>
{{footer}}
